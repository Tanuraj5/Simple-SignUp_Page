</head>

    <div class="signup">
        <h2>Sign Up</h2>

        <form action="">

        </label>
</div>

    <div class="name">
        <div class="firstname">
        <label for="firstname" >
            <input type="text" placeholder="First name">
        </label>
        
</div>

        <div class="lastname">
        <label for="Lastname" >
            <input type="text" placeholder="Last name">
        </label>
        </div>
</div>


<div class="password">
        <label for="password" >
            <input type="password" name="" id="" placeholder="Password">
        </label>
</div>


        <button type="submit">Sign Up</button>




        </form>

    </div>
